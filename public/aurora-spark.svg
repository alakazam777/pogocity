<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>PogoSphere — Aurora Spark orb (8c distillation, transparent)</title>
  <!--
    Distillation of 08c-aurora-spark-outside.svg keeping only the central
    orb (same gradients, same colors) and dropping the external sparks /
    connecting lines / star dots that pushed the SVG to the corners of a
    1024×1024 viewBox and made the icon look square at header / favicon
    sizes. The orb itself is a pixel-perfect copy of 8c — only the
    decorations outside the orb were stripped, and the viewBox is now
    tight (640×640 with the orb at 320,320 r=320). 100% transparent
    background.

    Companion files in /public/ for future reuse:
      - aurora-spark.png        — orb-only, transparent, 1024×1024
      - aurora-spark-bg.svg     — orb-only, dark navy bg (= iOS AppIcon)
      - aurora-spark-bg.png     — orb-only, dark navy bg, 1024×1024
      - aurora-spark-full.svg   — full 8c WITH external sparks, transparent
      - aurora-spark-full.png   — full 8c WITH external sparks, transparent
      - aurora-spark-full-bg.svg — full 8c, dark navy bg (= original 08c)
      - aurora-spark-full-bg.png — full 8c, dark navy bg, 1024×1024
  -->
  <defs>
    <radialGradient id="orb8c" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="20%" stop-color="#f0abfc"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="92%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c0a30"/>
    </radialGradient>
    <radialGradient id="hilight8c" cx="32%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="320" cy="320" r="320" fill="url(#orb8c)"/>
  <circle cx="320" cy="320" r="320" fill="url(#hilight8c)"/>
  <circle cx="320" cy="320" r="319" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
</svg>
