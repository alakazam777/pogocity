<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="cp"><circle cx="250" cy="250" r="210"/></clipPath>
    <clipPath id="tp"><rect x="40" y="40" width="420" height="210"/></clipPath>
    <clipPath id="bp"><rect x="40" y="250" width="420" height="210"/></clipPath>

    <radialGradient id="red_top" cx="35%" cy="22%" r="75%">
      <stop offset="0%"   stop-color="#FFB3B3"/>
      <stop offset="22%"  stop-color="#FF5858"/>
      <stop offset="50%"  stop-color="#CC0000"/>
      <stop offset="80%"  stop-color="#880000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </radialGradient>
    <linearGradient id="red_shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE3E3" stop-opacity="0.4"/>
      <stop offset="40%"  stop-color="#FF9999" stop-opacity="0.25"/>
      <stop offset="70%"  stop-color="#FFB3B3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#CC0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="white_bot" cx="35%" cy="22%" r="75%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </radialGradient>
    <radialGradient id="red_btn" cx="30%" cy="25%" r="68%">
      <stop offset="0%"   stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="red_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#880000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec_s1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec_s2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="258" cy="476" rx="155" ry="22" fill="url(#red_shadow)"/>

  <circle cx="250" cy="250" r="210" fill="url(#red_top)" clip-path="url(#tp)"/>
  <circle cx="250" cy="250" r="210" fill="url(#red_shimmer)" clip-path="url(#tp)"/>
  <circle cx="250" cy="250" r="210" fill="url(#white_bot)" clip-path="url(#bp)"/>

  <g clip-path="url(#cp)" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.12">
    <ellipse cx="250" cy="160" rx="170" ry="42"/>
    <ellipse cx="250" cy="340" rx="170" ry="42"/>
    <ellipse cx="250" cy="250" rx="70"  ry="210"/>
    <ellipse cx="250" cy="250" rx="140" ry="210"/>
  </g>

  <ellipse cx="195" cy="135" rx="105" ry="58" fill="url(#spec_s1)" clip-path="url(#tp)"/>
  <ellipse cx="170" cy="105" rx="48" ry="20" fill="url(#spec_s2)" clip-path="url(#tp)"/>

  <rect x="40" y="238" width="420" height="24" fill="#0a0010" clip-path="url(#cp)"/>
  <rect x="40" y="238" width="420" height="3"  fill="#4a4a4a" clip-path="url(#cp)"/>
  <rect x="40" y="259" width="420" height="3"  fill="#000" clip-path="url(#cp)"/>

  <circle cx="250" cy="250" r="46" fill="url(#red_btn)"/>
  <circle cx="250" cy="250" r="46" fill="none" stroke="#CC0000" stroke-width="1.5" opacity="0.5"/>
  <circle cx="250" cy="250" r="31" fill="white"/>
  <ellipse cx="243" cy="242" rx="10" ry="8" fill="white" opacity="0.7"/>
  <circle cx="250" cy="250" r="31" fill="none" stroke="#d8c8c8" stroke-width="1"/>

  <circle cx="250" cy="250" r="210" fill="none" stroke="#0a0010" stroke-width="9"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#FFB3B3" stroke-width="2" opacity="0.35"/>
</svg>
